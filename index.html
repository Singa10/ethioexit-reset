<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — EthioExit</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body {
    font-family: -apple-system, Roboto, Arial, sans-serif;
    background: #1A1A2E;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: #22223A;
    border-radius: 16px;
    padding: 32px 24px;
    max-width: 380px;
    width: 100%;
  }
  h1 { font-size: 20px; margin-bottom: 8px; color: #FFC107; }
  p { font-size: 14px; color: #ccc; margin-bottom: 20px; }
  input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #1A1A2E;
    color: #fff;
    font-size: 15px;
    margin-bottom: 14px;
    box-sizing: border-box;
  }
  button {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: none;
    background: #FFC107;
    color: #1A1A2E;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #msg { margin-top: 14px; font-size: 14px; text-align: center; word-break: break-word; }
  .success { color: #4CAF50; }
  .error { color: #FF5252; }
</style>
</head>
<body>
  <div class="card">
    <h1>Reset Your Password</h1>
    <p id="subtitle">Enter a new password for your EthioExit account.</p>
    <input type="password" id="password" placeholder="New password (min 6 characters)" />
    <input type="password" id="confirm" placeholder="Confirm new password" />
    <button id="submitBtn" disabled>Verifying link...</button>
    <div id="msg"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://vcxbmzrkicspfskcskar.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZjeGJtenJraWNzcGZza2Nza2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNTIzMjcsImV4cCI6MjA5NDYyODMyN30.nqOMUwU81vwl88Dg43sQanU5HBywZh_Q8mR_QEgWGO4';

    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');
    const subtitle = document.getElementById('subtitle');

    let supabaseClient;
    let sessionReady = false;

    function showError(text) {
      msg.textContent = text;
      msg.className = 'error';
    }

    async function init() {
      if (typeof window.supabase === 'undefined') {
        showError('Could not load required library. Check your internet connection and reload this page.');
        return;
      }

      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const hash = window.location.hash.startsWith('#')
        ? window.location.hash.substring(1)
        : window.location.hash;
      const params = new URLSearchParams(hash);
      const access_token = params.get('access_token');
      const refresh_token = params.get('refresh_token');

      if (!access_token || !refresh_token) {
        showError('This reset link is invalid or has expired. Please request a new one from the app.');
        return;
      }

      const { error } = await supabaseClient.auth.setSession({
        access_token,
        refresh_token,
      });

      if (error) {
        showError('This reset link is invalid or has expired. Please request a new one from the app.');
        return;
      }

      sessionReady = true;
      btn.disabled = false;
      btn.textContent = 'Update Password';
    }

    init();

    btn.addEventListener('click', async () => {
      try {
        if (!sessionReady) {
          showError('Session not ready yet. Please reload the page and try again.');
          return;
        }

        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;

        if (password.length < 6) {
          showError('Password must be at least 6 characters.');
          return;
        }
        if (password !== confirm) {
          showError('Passwords do not match.');
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Updating...';

        const { error } = await supabaseClient.auth.updateUser({ password });

        if (error) {
          showError(error.message);
          btn.disabled = false;
          btn.textContent = 'Update Password';
        } else {
          msg.textContent = 'Password updated! You can now close this page and log in with your new password in the app.';
          msg.className = 'success';
          btn.style.display = 'none';
          subtitle.style.display = 'none';
        }
      } catch (e) {
        showError('Unexpected error: ' + (e && e.message ? e.message : String(e)));
        btn.disabled = false;
        btn.textContent = 'Update Password';
      }
    });
  </script>
</body>
</html>
